name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk LeitorMP4.apk

      - name: Mostrar erros de compilação
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|ERROR:|What went wrong" -A3 build.log | head -60 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Erros de compilação::$msg"

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: LeitorMP4-apk
          path: LeitorMP4.apk

      - name: Publicar em Releases (para descarregar no celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" LeitorMP4.apk \
            --repo "${{ github.repository }}" \
            --title "Leitor MP4 v1.0.${{ github.run_number }}" \
            --notes "Abra este link no celular e toque em LeitorMP4.apk para descarregar e instalar."
