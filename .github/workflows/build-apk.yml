name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: LeitorMP4-apk
          path: app/build/outputs/apk/release/*.apk
